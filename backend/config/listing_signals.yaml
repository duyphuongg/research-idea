# Etsy Listing Signals — listing áo mới của shop US. Chỉnh tự do.
queries:
  - shirt
  - t-shirt
  - graphic tee
  - funny shirt
  - sweatshirt
  - hoodie
  - crewneck sweatshirt
  - comfort colors shirt
  - halloween shirt
  - christmas shirt
seed_query_suffix: shirt        # thêm "<seed> shirt" cho mỗi seed đang theo dõi
pages_per_query: 3              # 100 listing / trang, sắp theo ngày tạo
max_age_days: 30                # chỉ nhận listing đăng trong 30 ngày
track_days: 45                  # ngừng cập nhật sau 45 ngày tuổi
max_tracked: 20000
min_tag_listings: 2             # tag phải có ở >= 2 listing bứt phá
max_tags: 50
thresholds:
  breakout_max_age: 14
  breakout_min_saves_per_day: 5
  breakout_min_dsr: 0.15
  graduated_min_age: 30
  graduated_min_saves: 30
  graduated_min_saves_per_day: 1
  steady_min_saves_per_day: 2
  steady_min_dsr: 0.05
  dsr_min_delta_views: 10
# Tăng đều (phạt spike): lượt lưu/ngày tính trên 7 ngày, bị giảm khi phần lớn mức tăng dồn vào 1 ngày.
# Khi đã đủ dữ liệu, các ngưỡng *_saves_per_day ở trên so với số này thay cho mức tăng 1 ngày.
momentum:
  window_days: 7
  min_intervals: 3      # cần ít nhất 3 khoảng tăng giữa các lần quét trong 7 ngày
  spike_share: 0.6      # 1 ngày chiếm > 60% tổng tăng = spike …
  max_penalty: 0.7      # … bị trừ tối đa 70% (khi 100% tăng dồn vào 1 ngày)
